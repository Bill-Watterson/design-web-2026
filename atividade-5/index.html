<body class="bg-gray-100 p-6 min-h-screen">

  <!-- Container do Card -->
  <div class="max-w-sm mx-auto mt-10 bg-white rounded-2xl shadow-md overflow-hidden border border-green-200">
    
    <!-- Imagem do Card -->
    <img 
      src="https://instagram.frec10-1.fna.fbcdn.net/v/t39.30808-6/763671757_122134089219148121_3942573203104794856_n.jpg?stp=dst-jpg_e35_tt6&_nc_cat=110&ig_cache_key=Mzk1NTgwNDgzMTQ4NzM0NTk4Mg%3D%3D.3-ccb7-5&ccb=7-5&_nc_sid=58cdad&efg=eyJ2ZW5jb2RlX3RhZyI6IkNBUk9VU0VMX0lURU0ueHBpZHMuMTA4MC5zZHIucmVndWxhcl9waG90by5DMyJ9&_nc_ohc=CgKL5aEYKDIQ7kNvwESfl7G&_nc_oc=AdrtxN4QGqFx3YIPsP-I9uln-4kFE2wHEtXkDDhrpcS377jOKf1qrp5FHwqXfHEjywE&_nc_zt=23&_nc_ht=instagram.frec10-1.fna&_nc_gid=zUHLQf9gj4W9zFukGH4m1Q&_nc_ss=7a689&oh=00_AQH4Vc5JKgTTkNUV56r05-MGh3HezPgemkJE09qwqw6YKA&oe=6A93968D" 
      alt="Troféu Prêmio IEL 2026" 
      class="w-full h-48 object-cover"
    />

    <!-- Conteúdo do Card -->
    <div class="p-6 space-y-3">
      
      <!-- Badges de Destaque -->
      <div class="flex flex-wrap gap-2">
        <span class="bg-green-200 text-green-800 text-xs font-semibold px-2.5 py-1 rounded-full">
          1º Lugar
        </span>
        <span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-1 rounded-full">
          Inovação
        </span>
      </div>

      <!-- Título -->
      <h2 class="text-2xl font-bold text-green-800 leading-tight">
        Prêmio IEL 2026
      </h2>

      <!-- Descrição -->
      <p class="text-gray-700 text-base leading-relaxed">
        O IFRN destaca-se novamente no cenário regional, conquistando o topo das categorias de estágio e práticas inovadoras no Prêmio IEL.
      </p>

    </div>
  </div>

</body>
</html>
